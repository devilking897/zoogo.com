<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoogo - Buy & Sell</title>
  <style>
    :root {
      --primary-green: #2e7d32;
      --light-green: #4caf50;
      --yellow: #fbc02d;
      --white: #ffffff;
      --bg-gray: #f4f6f8;
      --dark-text: #2c3e50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: var(--bg-gray);
      color: var(--dark-text);
      min-height: 100vh;
    }

    header {
      background-color: var(--primary-green);
      padding: 1.5rem;
      color: var(--white);
      text-align: center;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--yellow);
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      background-color: var(--white);
      padding: 1rem;
      border-bottom: 2px solid #e0e0e0;
    }

    .nav-btn {
      padding: 0.7rem 2rem;
      border: 2px solid var(--primary-green);
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      background-color: var(--white);
      color: var(--primary-green);
      transition: all 0.2s ease;
    }

    .nav-btn.active {
      background-color: var(--primary-green);
      color: var(--white);
    }

    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .search-container {
      margin-bottom: 2rem;
    }

    .search-box {
      width: 100%;
      padding: 0.9rem;
      border: 2px solid var(--primary-green);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      background-color: var(--white);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--white);
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #eee;
    }

    .card-body {
      padding: 1rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .category-badge {
      align-self: flex-start;
      background-color: var(--yellow);
      color: #333;
      font-weight: bold;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.4rem;
    }

    .card-price {
      font-size: 1.2rem;
      color: var(--primary-green);
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 0.9rem;
      color: #666;
    }

    .form-container {
      background: var(--white);
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      max-width: 550px;
      margin: 0 auto;
    }

    .form-container h2 {
      color: var(--primary-green);
      margin-bottom: 1.2rem;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .form-group input, 
    .form-group select, 
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus, 
    .form-group select:focus, 
    .form-group textarea:focus {
      border-color: var(--primary-green);
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-green);
      color: var(--white);
      border: none;
      padding: 0.85rem;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: var(--light-green);
    }

    .hidden {
      display: none;
    }

    .empty-message {
      font-size: 1rem;
      color: #666;
      text-align: center;
      grid-column: 1 / -1;
      padding: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Zoogo</div>
  </header>

  <nav>
    <button class="nav-btn active" id="buyTab" onclick="switchTab('buy')">Buy</button>
    <button class="nav-btn" id="sellTab" onclick="switchTab('sell')">Sell</button>
  </nav>

  <div class="container">
    <!-- BUY SECTION -->
    <section id="buySection">
      <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="Search items..." onkeyup="filterItems()">
      </div>
      <div class="grid" id="itemsGrid"></div>
    </section>

    <!-- SELL SECTION -->
    <section id="sellSection" class="hidden">
      <div class="form-container">
        <h2>Sell an Item</h2>
        <form id="sellForm" onsubmit="handleSell(event)">
          <div class="form-group">
            <label for="itemName">Item Name</label>
            <input type="text" id="itemName" required>
          </div>

          <div class="form-group">
            <label for="itemPrice">Price (Rs.)</label>
            <input type="number" id="itemPrice" required>
          </div>

          <div class="form-group">
            <label for="itemCategory">Category</label>
            <select id="itemCategory" required>
              <option value="">Select Category</option>
              <option value="Electronics">Electronics</option>
              <option value="Vehicles">Vehicles</option>
              <option value="Fashion">Fashion</option>
              <option value="Home">Home</option>
              <option value="Sports">Sports</option>
            </select>
          </div>

          <div class="form-group">
            <label for="itemImage">Image URL</label>
            <input type="url" id="itemImage" required placeholder="https://example.com/image.jpg">
          </div>

          <div class="form-group">
            <label for="itemDescription">Description</label>
            <textarea id="itemDescription" rows="4" required></textarea>
          </div>

          <button type="submit" class="submit-btn">Post Item</button>
        </form>
      </div>
    </section>
  </div>

  <script>
    const items = [];

    function renderItems(itemList) {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';
      
      if (itemList.length === 0) {
        grid.innerHTML = '<div class="empty-message">No items listed yet. Use the Sell tab to add an item.</div>';
        return;
      }

      itemList.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/250x180?text=No+Image'">
          <div class="card-body">
            <span class="category-badge">${item.category}</span>
            <div class="card-title">${item.name}</div>
            <div class="card-price">Rs. ${Number(item.price).toLocaleString()}</div>
            <div class="card-desc">${item.description}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function switchTab(tab) {
      const buySection = document.getElementById('buySection');
      const sellSection = document.getElementById('sellSection');
      const buyTab = document.getElementById('buyTab');
      const sellTab = document.getElementById('sellTab');

      if (tab === 'buy') {
        buySection.classList.remove('hidden');
        sellSection.classList.add('hidden');
        buyTab.classList.add('active');
        sellTab.classList.remove('active');
      } else {
        sellSection.classList.remove('hidden');
        buySection.classList.add('hidden');
        sellTab.classList.add('active');
        buyTab.classList.remove('active');
      }
    }

    function filterItems() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = items.filter(item => 
        item.name.toLowerCase().includes(query) || 
        item.category.toLowerCase().includes(query) ||
        item.description.toLowerCase().includes(query)
      );
      renderItems(filtered);
    }

    function handleSell(event) {
      event.preventDefault();

      const newItem = {
        id: Date.now(),
        name: document.getElementById('itemName').value,
        price: document.getElementById('itemPrice').value,
        category: document.getElementById('itemCategory').value,
        image: document.getElementById('itemImage').value,
        description: document.getElementById('itemDescription').value
      };

      items.unshift(newItem);
      renderItems(items);
      document.getElementById('sellForm').reset();
      switchTab('buy');
    }

    renderItems(items);
  </script>
</body>
</html>
